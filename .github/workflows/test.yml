name: Tests

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} with Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ["1.25"]
        include:
          - os: ubuntu-latest
            packages: ./lib/util/... ./lib/crypto/... ./lib/sysinfo/... ./lib/testutil/... ./lib/cli/... ./lib/netutil/... ./internal/def/... ./internal/transport/... ./internal/live/... ./internal/agent/handler/... ./internal/agent/base/c2transport/... ./internal/cc/modules/... ./internal/cc/config/... ./internal/cc/base/ftp/... ./internal/cc/operator/...
          - os: windows-latest
            packages: ./lib/util/... ./lib/crypto/... ./lib/sysinfo/... ./lib/testutil/... ./lib/cli/... ./lib/netutil/... ./internal/def/... ./internal/transport/... ./internal/live/... ./internal/agent/handler/... ./internal/agent/base/c2transport/... ./internal/cc/modules/... ./internal/cc/config/... ./internal/cc/base/ftp/... ./internal/cc/operator/...

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: core/go.sum

      - name: Install dependencies
        working-directory: ./core
        run: go mod tidy

      - name: Run tests
        working-directory: ./core
        run: |
          go test -v -race "-coverprofile=coverage.txt" -covermode=atomic ${{ matrix.packages }}

      - name: Display coverage summary
        if: runner.os == 'Linux'
        working-directory: ./core
        run: |
          go tool cover -func=coverage.txt

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./core/coverage.txt
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
