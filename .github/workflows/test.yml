name: Tests

on:
  push:
    branches: [v5]
    paths:
      - "core/**"
      - "!core/internal/def/version.go"
  pull_request:
    branches: [v5]
    paths:
      - "core/**"
      - "!core/internal/def/version.go"
  schedule:
    # Weekly, not daily: the corpus cache means each run continues where the
    # previous one stopped, so a weekly campaign still accumulates coverage.
    # Run it on demand from the Actions tab (workflow_dispatch) for more.
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} with Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go-version: ["1.26"]
    env:
      # Agent features are opt-in Go build tags. CI exercises the full set so
      # every feature and its tests are compiled.
      BUILD_TAGS: "with_mesh with_kcp with_h2conn with_quic with_utls with_doh with_ech with_netlink with_uring"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: core/go.sum

      - name: Install dependencies
        working-directory: ./core
        run: go mod tidy

      - name: Install zig (for BOF loader and shellcode stager tests)
        if: runner.os == 'Linux'
        env:
          ZIG_VERSION: "0.16.0"
          ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
        run: |
          wget -q "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | sha256sum -c -
          tar -xf "zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sudo mv "zig-x86_64-linux-${ZIG_VERSION}" /usr/local/zig
          sudo ln -sf /usr/local/zig/zig /usr/local/bin/zig

      - name: Run C agent unit tests
        if: runner.os == 'Linux'
        working-directory: ./core/c_agent
        run: make test

      - name: Run tests (Linux, with race & coverage)
        if: runner.os == 'Linux'
        working-directory: ./core
        env:
          EMP3R0R_RACE_ON: "1"
        run: |
          go test -v -race -tags "$BUILD_TAGS" "-coverprofile=coverage.txt" -covermode=atomic ./...

      # These tests run outside -race: in-memory BOF loading conflicts with
      # checkptr, and the zig build tests only need a normal build pass.
      - name: Run Linux BOF loader and integration test (cgo)
        if: runner.os == 'Linux'
        working-directory: ./core
        env:
          CGO_ENABLED: 1
          EMP3R0R_RACE_ON: "0"
        run: |
          go test -v -tags "$BUILD_TAGS" ./lib/coffloader -count=1
          go test -v -tags "$BUILD_TAGS" ./lib/memmod -count=1
          go test -v -tags "$BUILD_TAGS" ./lib/script -count=1
          go test -v -tags "$BUILD_TAGS" ./internal/cc/modules -count=1
          # Repeat the zig-dependent builder tests without the race detector.
          go test -v -tags "$BUILD_TAGS" ./internal/cc/builder -count=1

      - name: Run memmod ELF loader tests without cgo (Linux)
        if: runner.os == 'Linux'
        working-directory: ./core
        env:
          CGO_ENABLED: "0"
          EMP3R0R_RACE_ON: "0"
        run: |
          go test -v -tags "$BUILD_TAGS" ./lib/memmod -count=1
          go test -v -tags "$BUILD_TAGS" ./lib/script -count=1
          # A static agent has no libc for the Linux BOF loader; pin the clear
          # diagnostic instead of letting an unresolved-symbol dump escape.
          go test -v -tags "$BUILD_TAGS" ./lib/coffloader -count=1

      - name: Run shellcode stager lifecycle and packer tests (cgo, no race)
        if: runner.os == 'Linux'
        working-directory: ./core/modules/stager_linux
        env:
          CGO_ENABLED: 1
        run: |
          # The test binary runs the C2 and the agent is built by build.py
          # (default full feature set), so both must use the same feature tags.
          # TestPackerEndToEnd covers both packers (RC4/LZSS) against each
          # download transport, including the decoder in unpack_stub_lzss.c.
          cd test && go test -v -tags "$BUILD_TAGS" -count=1 -timeout 8m \
            -run 'TestAgentEndToEndLifecycle|TestPackerEndToEnd'

      - name: Run stager payload embedding and sleep-mask e2e tests
        if: runner.os == 'Linux'
        working-directory: ./core/modules/stager_linux
        env:
          CGO_ENABLED: 1
        run: |
          # TestEmbedPayloadHeader checks the randomized local payload header.
          # TestCAgentSleepMask runs the C agent through a locally embedded
          # stager, lets its first check-in fail so it enters the sleep mask,
          # then inspects the process while the mask is active.
          cd test && go test -v -tags "$BUILD_TAGS" -count=1 -timeout 6m \
            -run 'TestEmbedPayloadHeader|TestCAgentSleepMask'

      - name: Run stager unit tests (sleep mask and LZSS decoder)
        if: runner.os == 'Linux'
        working-directory: ./core/modules/stager_linux
        run: make test

      - name: Run C agent end-to-end test (cgo, no race)
        if: runner.os == 'Linux'
        working-directory: ./core/modules/stager_linux
        env:
          CGO_ENABLED: 1
        run: |
          # Builds core/c_agent's reference agent as an executable, malasada
          # raw PIC, and locally embedded stager PIC (raw/exe/so); system
          # libcrypto and libcurl are resolved with dlopen. Each form must
          # check in, run commands and execute a BOF against the real C2.
          cd test && go test -v -tags "$BUILD_TAGS" -count=1 -timeout 5m -run TestCAgentEndToEnd

      # A musl agent can only be exercised on a real musl host. Keep the job on
      # the existing ubuntu runner and run the same e2e inside Alpine: a
      # `container: alpine` job would have to run actions/checkout's Node
      # runtime on musl, so the Alpine work stays in one docker invocation.
      - name: Run musl C agent end-to-end in Alpine
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e CGO_ENABLED=1 -e EMP3R0R_RACE_ON=0 -e EMP3R0R_CAGENT_LIBC=musl \
            alpine:3.21 /bin/sh -c '
              set -eux
              apk add --no-cache bash build-base linux-headers tar xz curl openssl libcurl
              curl -fsSL -o /tmp/go.tar.gz "https://go.dev/dl/go1.26.2.linux-amd64.tar.gz"
              echo "990e6b4bbba816dc3ee129eaeaf4b42f17c2800b88a2166c265ac1a200262282  /tmp/go.tar.gz" | sha256sum -c -
              tar -C /usr/local -xzf /tmp/go.tar.gz
              curl -fsSL -o /tmp/zig.tar.xz "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
              echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
              tar -C /usr/local -xf /tmp/zig.tar.xz
              export PATH="/usr/local/go/bin:/usr/local/zig-x86_64-linux-0.16.0:$PATH"
              cd core/modules/stager_linux/test
              go test -v -count=1 -timeout 8m -run TestCAgentEndToEnd
            '

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-i686-gcc
            make
            nasm

      # The SilentMoonwalk cgo package (lib/syscall/smw) needs
      # desyncspoofer.syso, assembled from csrc/DesyncSpoofer.asm with nasm
      # at build time. The .syso is gitignored, so generate it here before
      # any cgo-enabled test build (go test -race requires cgo).
      - name: Generate SilentMoonwalk desync object (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: ./core
        run: |
          make -C lib/syscall/smw

      - name: Run tests (Windows, with race)
        if: runner.os == 'Windows'
        working-directory: ./core
        env:
          CGO_ENABLED: "1"
          EMP3R0R_RACE_ON: "1"
        run: |
          go test -v -race -tags "$BUILD_TAGS" ./...

      - name: Build COFFLoader and BOF fixtures (Windows)
        if: runner.os == 'Windows'
        working-directory: ./core/modules
        shell: msys2 {0}
        run: |
          export PATH="$PATH:/mingw32/bin"
          make -C coffloader dll dll32
          make -C Remote-OPs/src/Remote/get_priv
          make -C Remote-OPs/src/Remote/ProcessListHandles
          cd Kerbeus-BOF && bash make_all.sh

      - name: Run BOF and module integration without race (Windows only)
        if: runner.os == 'Windows'
        working-directory: ./core
        shell: msys2 {0}
        env:
          EMP3R0R_RACE_ON: "0"
        run: |
          go test -v -tags "$BUILD_TAGS" -gcflags="all=-d=checkptr=0" ./lib/coffloader -count=1
          go test -v -tags "$BUILD_TAGS" -gcflags="all=-d=checkptr=0" ./lib/memmod -count=1
          go test -v -tags "$BUILD_TAGS" -gcflags="all=-d=checkptr=0" ./internal/agent/modules/...
          go test -v -tags "$BUILD_TAGS" -gcflags="all=-d=checkptr=0" ./internal/cc/modules/...

      - name: Display coverage summary
        if: runner.os == 'Linux'
        working-directory: ./core
        run: |
          go tool cover -func=coverage.txt
          PERCENT=$(go tool cover -func=coverage.txt | grep total: | awk '{print $3}')
          echo "### Test Coverage: $PERCENT" >> $GITHUB_STEP_SUMMARY

  fuzz:
    name: Fuzz C agent (libFuzzer, ASan+UBSan)
    runs-on: ubuntu-latest
    # Fuzzing is too slow for every PR: run it on the nightly schedule and on
    # manual dispatch only. Developers can run `make fuzz` locally any time.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      # The corpus cache carries coverage between runs, so each weekly run
      # continues where the previous one stopped instead of from the checked-in
      # seeds. Keep this modest: the whole suite runs sequentially in CI.
      FUZZ_TIME: "300"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # fuzz_bof links the real coffloader_linux module, whose Makefile builds
      # with the project's pinned zig.
      - name: Install zig (for the BOF fuzz target)
        env:
          ZIG_VERSION: "0.16.0"
          ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
        run: |
          wget -q "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | sha256sum -c -
          tar -xf "zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sudo mv "zig-x86_64-linux-${ZIG_VERSION}" /usr/local/zig
          sudo ln -sf /usr/local/zig/zig /usr/local/bin/zig

      - name: Restore cumulative fuzz corpus
        uses: actions/cache@v4
        with:
          path: core/c_agent/build/corpus
          key: cagent-fuzz-corpus-${{ github.sha }}
          restore-keys: |
            cagent-fuzz-corpus-

      - name: Build and run the fuzzers
        working-directory: ./core/c_agent
        run: |
          clang --version
          make fuzz FUZZER=libfuzzer HOSTCC=clang FUZZ_TIME="$FUZZ_TIME"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cagent-fuzz-crashes
          path: core/c_agent/build/crash/
          if-no-files-found: ignore
