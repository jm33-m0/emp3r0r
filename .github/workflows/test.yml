name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} with Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.21", "1.22", "1.23"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Install dependencies
        working-directory: ./core
        run: go mod download

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        working-directory: ./core
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./lib/util/... ./lib/crypto/... ./lib/sysinfo/... ./lib/testutil/...

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        working-directory: ./core
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./lib/util/... ./lib/crypto/... ./lib/testutil/...

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: ./core
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./lib/util/... ./lib/crypto/... ./lib/testutil/...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23'
        uses: codecov/codecov-action@v4
        with:
          file: ./core/coverage.txt
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  test-linux-only:
    name: Linux-only tests with Go 1.23
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install dependencies
        working-directory: ./core
        run: go mod download

      - name: Run Linux-specific tests
        working-directory: ./core
        run: |
          go test -v -tags linux -coverprofile=coverage-linux.txt -covermode=atomic ./lib/sysinfo/...

      - name: Display coverage summary
        working-directory: ./core
        run: |
          go tool cover -func=coverage-linux.txt

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: ./core
          args: --timeout=5m ./lib/util/... ./lib/crypto/... ./lib/sysinfo/... ./lib/testutil/...
