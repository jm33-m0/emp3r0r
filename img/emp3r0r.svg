<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background & Metal Gradients -->
    <radialGradient id="bg-grad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#661414" />
      <stop offset="55%" stop-color="#2c323d" />
      <stop offset="100%" stop-color="#161920" />
    </radialGradient>

    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3f47" />
      <stop offset="50%" stop-color="#1e2229" />
      <stop offset="100%" stop-color="#0f1115" />
    </linearGradient>

    <linearGradient id="metal-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a828e" />
      <stop offset="50%" stop-color="#454b54" />
      <stop offset="100%" stop-color="#22262c" />
    </linearGradient>

    <linearGradient id="crimson-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2a2a" />
      <stop offset="50%" stop-color="#cc0000" />
      <stop offset="100%" stop-color="#660000" />
    </linearGradient>

    <linearGradient id="tux-yellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00" />
      <stop offset="60%" stop-color="#ff8800" />
      <stop offset="100%" stop-color="#cc5500" />
    </linearGradient>

    <radialGradient id="tux-belly" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#dce3ec" />
      <stop offset="100%" stop-color="#b0bccb" />
    </radialGradient>

    <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield / Circular Frame -->
  <circle cx="400" cy="400" r="360" fill="url(#bg-grad)" stroke="url(#metal-light)" stroke-width="12" />
  <circle cx="400" cy="400" r="340" fill="none" stroke="#ff1a1a" stroke-width="2" stroke-opacity="0.6" />
  <circle cx="400" cy="400" r="325" fill="none" stroke="#525a68" stroke-width="4" stroke-dasharray="15,10" />

  <!-- Red Teaming / C2 Mesh Network Background -->
  <g stroke="#ff4d4d" stroke-width="1.5" opacity="0.55">
    <!-- Left Network -->
    <line x1="120" y1="300" x2="200" y2="240" />
    <line x1="200" y1="240" x2="260" y2="310" />
    <line x1="200" y1="240" x2="160" y2="170" />
    <line x1="120" y1="300" x2="150" y2="410" />
    <line x1="150" y1="410" x2="240" y2="440" />
    <line x1="260" y1="310" x2="240" y2="440" />
    <line x1="150" y1="410" x2="100" y2="490" />
    <!-- Right Network -->
    <line x1="680" y1="300" x2="600" y2="240" />
    <line x1="600" y1="240" x2="540" y2="310" />
    <line x1="600" y1="240" x2="640" y2="170" />
    <line x1="680" y1="300" x2="650" y2="410" />
    <line x1="650" y1="410" x2="560" y2="440" />
    <line x1="540" y1="310" x2="560" y2="440" />
    <line x1="650" y1="410" x2="700" y2="490" />
  </g>

  <!-- Network Nodes -->
  <g fill="#ff2a2a" filter="url(#red-glow)">
    <circle cx="120" cy="300" r="6" />
    <circle cx="200" cy="240" r="8" />
    <circle cx="160" cy="170" r="5" />
    <circle cx="260" cy="310" r="6" />
    <circle cx="150" cy="410" r="9" />
    <circle cx="240" cy="440" r="6" />
    <circle cx="100" cy="490" r="5" />
    <circle cx="680" cy="300" r="6" />
    <circle cx="600" cy="240" r="8" />
    <circle cx="640" cy="170" r="5" />
    <circle cx="540" cy="310" r="6" />
    <circle cx="650" cy="410" r="9" />
    <circle cx="560" cy="440" r="6" />
    <circle cx="700" cy="490" r="5" />
  </g>

  <!-- Binary Matrix Background Data -->
  <g fill="#ff6666" opacity="0.35" font-family="monospace" font-size="14" font-weight="bold">
    <text x="175" y="290">01000101</text>
    <text x="160" y="310">01001100</text>
    <text x="160" y="330">01000110</text>
    <text x="175" y="350">00110000</text>
    <text x="190" y="370">01111000</text>
    <text x="560" y="290">01000011</text>
    <text x="575" y="310">00110010</text>
    <text x="575" y="330">01010010</text>
    <text x="560" y="350">01001111</text>
    <text x="545" y="370">01001111</text>
  </g>

  <!-- TUX FLIPPERS (Unobstructed Penguin Wings) -->
  <!-- Left Flipper -->
  <path d="M 255 385 C 185 415, 140 505, 165 555 C 180 580, 220 545, 240 495 Z" fill="#101216" stroke="#626b7a" stroke-width="4" />
  <!-- Right Flipper -->
  <path d="M 545 385 C 615 415, 660 505, 635 555 C 620 580, 580 545, 560 495 Z" fill="#101216" stroke="#626b7a" stroke-width="4" />

  <!-- TUX PLUMP BODY & HEAD SILHOUETTE -->
  <path d="M 400 210 C 300 210, 275 275, 270 350 C 265 410, 215 470, 225 560 C 235 615, 310 625, 400 625 C 490 625, 565 615, 575 560 C 585 470, 535 410, 530 350 C 525 275, 500 210, 400 210 Z" fill="#101216" stroke="#626b7a" stroke-width="4" />

  <!-- TUX FULL WHITE BELLY & CHEST (Unobstructed) -->
  <path d="M 400 365 C 310 365, 255 430, 255 535 C 255 600, 320 615, 400 615 C 480 615, 545 600, 545 535 C 545 430, 490 365, 400 365 Z" fill="url(#tux-belly)" />

  <!-- LIGHTWEIGHT IMPERIAL CHAIN & MEDALLION (Rests on belly without hiding Tux shape) -->
  <!-- Gunmetal Chain of Office Links -->
  <g fill="none" stroke="url(#metal-light)" stroke-width="5">
    <ellipse cx="285" cy="425" rx="13" ry="7" transform="rotate(38 285 425)" />
    <ellipse cx="312" cy="445" rx="13" ry="7" transform="rotate(28 312 445)" />
    <ellipse cx="342" cy="462" rx="13" ry="7" transform="rotate(18 342 462)" />
    <ellipse cx="458" cy="462" rx="13" ry="7" transform="rotate(-18 458 462)" />
    <ellipse cx="488" cy="445" rx="13" ry="7" transform="rotate(-28 488 445)" />
    <ellipse cx="515" cy="425" rx="13" ry="7" transform="rotate(-38 515 425)" />
  </g>

  <!-- Gunmetal Shoulder Clasps -->
  <circle cx="262" cy="402" r="16" fill="url(#metal-light)" stroke="#101216" stroke-width="3" />
  <circle cx="262" cy="402" r="8" fill="url(#crimson-glow)" stroke="#ff9999" stroke-width="1" />
  <circle cx="538" cy="402" r="16" fill="url(#metal-light)" stroke="#101216" stroke-width="3" />
  <circle cx="538" cy="402" r="8" fill="url(#crimson-glow)" stroke="#ff9999" stroke-width="1" />

  <!-- Center Sovereign Ruby Medallion -->
  <polygon points="400,435 432,470 400,512 368,470" fill="url(#metal-light)" stroke="#101216" stroke-width="4" stroke-linejoin="round" />
  <polygon points="400,447 420,470 400,498 380,470" fill="url(#crimson-glow)" stroke="#ff9999" stroke-width="1.5" filter="url(#red-glow)" />

  <!-- TUX CONTIGUOUS BIG EYES -->
  <!-- Left Eye (Classic Tux Oval with Determined Brow) -->
  <ellipse cx="362" cy="325" rx="34" ry="42" fill="#ffffff" stroke="#101216" stroke-width="5" />
  <ellipse cx="372" cy="330" rx="14" ry="18" fill="#101216" />
  <circle cx="367" cy="322" r="5" fill="#ffffff" />
  <!-- Left Angry/Focused Brow Cut -->
  <path d="M 320 285 L 400 315 L 400 285 Z" fill="#101216" />

  <!-- Right Eye (Cybernetic Scouter / Borg Tux Implant) -->
  <ellipse cx="438" cy="325" rx="34" ry="42" fill="#2a0505" stroke="#101216" stroke-width="5" />
  <!-- Cyber Monocle Frame -->
  <path d="M 405 295 L 475 280 L 515 305 L 510 360 L 465 375 L 408 350 Z" fill="url(#metal-dark)" stroke="url(#metal-light)" stroke-width="4" stroke-linejoin="round" />
  <!-- Cyber Ear/Temple Mount -->
  <rect x="500" y="295" width="22" height="55" rx="6" fill="url(#metal-light)" stroke="#101216" stroke-width="3" />
  <!-- Glowing Red Optic Lens -->
  <circle cx="450" cy="328" r="22" fill="#1a0000" stroke="#7a828e" stroke-width="3" />
  <circle cx="450" cy="328" r="14" fill="#ff1a1a" filter="url(#red-glow)" />
  <circle cx="450" cy="328" r="6" fill="#ffffff" />
  <!-- Crosshair lines in Cyber Eye -->
  <line x1="428" y1="328" x2="472" y2="328" stroke="#ff1a1a" stroke-width="1.5" opacity="0.8" />
  <line x1="450" y1="306" x2="450" y2="350" stroke="#ff1a1a" stroke-width="1.5" opacity="0.8" />

  <!-- TUX CLASSIC WIDE CHUBBY BILL -->
  <path d="M 330 355 C 355 330, 445 330, 470 355 C 490 370, 455 415, 400 420 C 345 415, 310 370, 330 355 Z" fill="url(#tux-yellow)" stroke="#1a0d00" stroke-width="4" stroke-linejoin="round" />
  <!-- Tux Mouth Smile/Grin Line -->
  <path d="M 342 368 Q 400 400 458 368" fill="none" stroke="#662200" stroke-width="3.5" stroke-linecap="round" />
  <!-- Beak Highlight -->
  <path d="M 360 350 Q 400 338 440 350" fill="none" stroke="#ffee88" stroke-width="3" stroke-linecap="round" opacity="0.7" />

  <!-- THE EMPEROR'S CROWN (Seated on Tux's Head) -->
  <g stroke-linejoin="round">
    <!-- Crown Back Spikes (Red Glow) -->
    <polygon points="270,245 245,120 320,195 345,105 400,175 455,105 480,195 555,120 530,245" fill="#1a0505" stroke="#ff1a1a" stroke-width="4" filter="url(#red-glow)" />
    
    <!-- Crown Main Metallic Structure -->
    <polygon points="280,260 260,135 335,210 400,80 465,210 540,135 520,260" fill="url(#metal-light)" stroke="#101216" stroke-width="5" />
    
    <!-- Inner Dark Metal Layer -->
    <polygon points="295,250 280,165 340,225 400,115 460,225 520,165 505,250" fill="url(#metal-dark)" />

    <!-- Crown Base Band -->
    <path d="M 275 255 C 335 230, 465 230, 525 255 L 518 288 C 460 265, 340 265, 282 288 Z" fill="url(#metal-light)" stroke="#101216" stroke-width="5" />
    <path d="M 282 272 C 340 248, 460 248, 518 272" fill="none" stroke="#ff1a1a" stroke-width="3" />

    <!-- Center Ruby Diamond (Root/C2 Core) -->
    <polygon points="400,175 420,212 400,250 380,212" fill="url(#crimson-glow)" stroke="#ff9999" stroke-width="2" filter="url(#red-glow)" />
    <!-- Side Rubies -->
    <polygon points="320,215 332,235 320,255 308,235" fill="url(#crimson-glow)" stroke="#ff9999" stroke-width="1.5" />
    <polygon points="480,215 492,235 480,255 468,235" fill="url(#crimson-glow)" stroke="#ff9999" stroke-width="1.5" />
  </g>

  <!-- Bottom Banner / Text Plate -->
  <g>
    <!-- Red Outer Frame -->
    <polygon points="115,575 685,575 665,685 450,685 400,745 350,685 135,685" fill="#12141a" stroke="#ff1a1a" stroke-width="6" stroke-linejoin="round" filter="url(#red-glow)" />
    <!-- Inner Dark Plate -->
    <polygon points="125,583 675,583 657,677 445,677 400,730 355,677 143,677" fill="url(#metal-dark)" stroke="#3a3f47" stroke-width="2" />
    
    <!-- Bottom Center Gem -->
    <polygon points="370,680 430,680 400,720" fill="url(#crimson-glow)" />

    <!-- TUX WEBBED FEET (Resting on top of the banner) -->
    <!-- Left Foot -->
    <path d="M 225 585 C 215 555, 245 545, 255 565 C 265 535, 295 535, 300 565 C 315 545, 345 555, 330 585 Z" fill="url(#tux-yellow)" stroke="#1a0d00" stroke-width="4" stroke-linejoin="round" />
    <!-- Right Foot -->
    <path d="M 470 585 C 455 555, 485 545, 500 565 C 505 535, 535 535, 545 565 C 555 545, 585 555, 575 585 Z" fill="url(#tux-yellow)" stroke="#1a0d00" stroke-width="4" stroke-linejoin="round" />

    <!-- Typography: emp3r0r -->
    <text x="400" y="655" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="105" font-weight="900" text-anchor="middle" fill="url(#metal-light)" stroke="#ff1a1a" stroke-width="3" letter-spacing="4">emp3r0r</text>
          
    <!-- Text Highlight Overlay -->
    <text x="400" y="655" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="105" font-weight="900" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" letter-spacing="4">emp3r0r</text>
  </g>
</svg>
